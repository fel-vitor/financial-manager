<mat-sidenav-container class="sidenav-container">
    <mat-sidenav class="sidenav" [opened]="isSideNavOpened()" [mode]="sideNavMode()">
        <app-sidenav-items />
    </mat-sidenav>

    <mat-sidenav-content>
        <div class="container">
            <div class="container-content">
                <ng-content />
            </div>
        </div>
    </mat-sidenav-content>
</mat-sidenav-container>
