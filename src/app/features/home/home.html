<app-balance
    [transactions]="transactions()"
/>

<div class="actions">
    <a matButton="filled" [routerLink]="'create'">Adicionar transação</a>
</div>

<div class="transactions">
    @for (item of transactions(); track item) {
        <app-transaction-item class="transaction" [transaction]="item" (edit)="edit($event)" />
    } @empty {
        <app-no-transactions />
    } 
</div>
