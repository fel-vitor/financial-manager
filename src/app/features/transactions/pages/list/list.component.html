<div class="actions">
    <app-search class="search" />
    <a class="add-transaction" matButton="filled" [routerLink]="'create/new'">Adicionar transação</a>
</div>

<app-transaction-container class="transactions" [transactions]="items()">
    <ng-template #item let-item="item">
        <app-transaction-item
            class="transaction"
            [transaction]="item"
            (edit)="edit($event)"
            (remove)="remove($event)"
        />
    </ng-template>

    <ng-template #noItems>
        <app-no-transactions />
    </ng-template>
</app-transaction-container>
